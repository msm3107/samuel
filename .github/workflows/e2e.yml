name: End-to-end

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Real Supabase and browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local Supabase in Docker, from supabase/config.toml. Nothing here can
      # reach a hosted project: the keys it prints are the published local
      # development keys, read at run time by scripts/local-env.mjs.
      - run: pnpm supabase:start

      - run: pnpm exec playwright install --with-deps chromium

      - name: Real-Supabase suites (Vitest)
        run: pnpm test:supabase

      # pgTAP, run as the table owner: proves what the API's grants hide from
      # the Vitest suites, such as the audit_events append-only trigger.
      - name: Database suites (pgTAP)
        run: pnpm test:db

      - name: Browser suite against the stub auth server
        run: pnpm test:e2e

      - name: Browser suite against real Supabase
        run: pnpm test:e2e:supabase

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - if: always()
        run: pnpm supabase:stop
